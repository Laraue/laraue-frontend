name: Build Vue App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - run: pnpm nuxt build

      - name: Pack build output
        if: github.ref == 'refs/heads/main'
        run: tar -czf laraue.tar.gz -C .output .

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: laraue-frontend
          path: laraue.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: frontend-production
    steps:
      - name: Notify deploy started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 Deploy started: Laraue Frontend (${{ github.sha }})"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: laraue-frontend

      - name: Upload host
        uses: marcodallasanta/ssh-scp-deploy@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }} # "example.com"
          port: ${{ secrets.SSH_PORT }} # 22
          user: ${{ secrets.SSH_USER }} # "user"
          password: ${{ secrets.SSH_PASSWORD }} # "password"
          local: laraue.tar.gz
          remote: "/home/laraue/frontend/laraue"
          post_upload: |-
            cd /home/laraue/frontend/laraue && find . -mindepth 1 ! -name laraue.tar.gz -delete &&
            tar -xzf laraue.tar.gz && rm laraue.tar.gz

      - name: Build container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/laraue && docker compose build frontendssrhost
            docker compose up -d --force-recreate frontendssrhost

      - name: Notify deploy finished
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Deploy finished: Laraue Frontend (${{ github.sha }})"

      - name: Notify deploy failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Deploy failed: Laraue Frontend (${{ github.sha }})"
